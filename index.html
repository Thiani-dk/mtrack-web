<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00A651" />
    <!-- Standard Chrome PWA install tag -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple PWA tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="M-Track" />
    <!-- Apple touch icon for iOS home screen -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>M-Track</title>

    <!--
      Boot guard. If the app bundle fails to load or execute (e.g. a stale
      cached index.html pointing at hashed files that 404), React never mounts
      and the tab goes blank with no way for a non-technical user to recover.
      This shows a plain "try refreshing" panel instead. It is removed the
      instant React renders (main.tsx calls window.__mtrackBooted).
    -->
    <style>
      #boot-fallback {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f7f5;
        color: #1a1a1a;
      }
      #boot-fallback .bf-box { max-width: 20rem; text-align: center; }
      #boot-fallback h1 { font-size: 1.05rem; margin: 0 0 0.4rem; }
      #boot-fallback p { margin: 0 0 1.25rem; opacity: 0.7; }
      #boot-fallback button {
        font: inherit;
        font-weight: 600;
        border: 0;
        cursor: pointer;
        border-radius: 0.6rem;
        padding: 0.7rem 1.5rem;
        background: #e8850a;
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #boot-fallback { background: #111; color: #f5f5f5; }
      }
    </style>
    <script>
      (function () {
        var booted = false;
        function reveal() {
          if (booted) return;
          var el = document.getElementById('boot-fallback');
          if (el) el.style.display = 'flex';
        }
        window.__mtrackBooted = function () {
          booted = true;
          var el = document.getElementById('boot-fallback');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        };
        // 1) The bundle never executed __mtrackBooted within a sane window.
        setTimeout(reveal, 12000);
        // 2) A <script>/<link> failed to load, or the bundle threw before it
        //    could mount. Either way, nothing rendered.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { reveal(); return; }
          if (!booted && e && e.message) reveal();
        }, true);
        // 3) The service worker reports a hashed JS/CSS asset 404'd.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function (e) {
            var d = e && e.data;
            if (d && d.type === 'ASSET_LOAD_FAILED' && /\.(?:js|css)(?:\?|$)/.test(d.url || '')) reveal();
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="bf-box">
          <h1>Something didn't load right</h1>
          <p>Try refreshing the page.</p>
          <button type="button" onclick="location.reload()">Refresh</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
